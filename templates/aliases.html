<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=1" />
    <title>角色</title>
    <style>
      <!-- GOK:REPORT_STYLE -->
    </style>
  </head>
  <body class="roles-report">
    <!-- GOK:REPORT_MACROS -->
    <div class="section-heading">
      <h1>
        {% if data.keyword %}角色：{{ data.keyword }}{% else %}角色{% endif %}
      </h1>
      <span class="muted">共 {{ data.list | length }} 个</span>
    </div>
    <table class="roles-table">
      <colgroup>
        <col class="col-name" />
        <col class="col-id" />
        <col class="col-alias" />
      </colgroup>
      <thead>
        <tr>
          <th>游戏昵称</th>
          <th>营地 ID</th>
          <th>别名</th>
        </tr>
      </thead>
      <tbody>
        {% for row in data.list %}
        <tr>
          <td>{{ row.role_name or '待更新昵称' }}</td>
          <td>{{ row.gokid }}</td>
          <td>{{ row.alias or '—' }}</td>
        </tr>
        {% else %}
        <tr>
          <td colspan="3" class="muted">暂无角色记录</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {{ footer(data_time) }}
  </body>
</html>
