<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>王者荣耀数据查询工具</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23152135'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='23' fill='white'%3E%E7%8E%8B%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="topbar-inner">
          <a class="brand" href="#login" aria-label="王者荣耀数据查询工具首页"
            ><strong>王者荣耀数据查询工具</strong
            ><span>玩家资料与对局回顾</span></a
          >
          <nav class="navigation" aria-label="功能导航">
            <button
              class="nav-item active"
              data-page="login"
              aria-current="page"
              type="button"
            >
              <span data-icon="user"></span>账号管理
            </button>
            <button class="nav-item" data-page="query" type="button">
              <span data-icon="search"></span>玩家查询
            </button>
            <button class="nav-item" data-page="aliases" type="button">
              <span data-icon="tag"></span>角色别名
            </button>
          </nav>
        </div>
      </header>
      <main class="main-content">
        <div id="app-status" class="inline-notice" role="alert" hidden></div>
        <section id="panel-query" class="page-panel" hidden>
          <header class="page-heading">
            <div>
              <h1>玩家查询</h1>
              <p>查询玩家资料与近期对局</p>
            </div>
          </header>
          <form id="query-form" class="search-bar">
            <label class="search-field"
              ><span data-icon="search"></span
              ><input
                id="query-keyword"
                type="text"
                placeholder="营地 ID、游戏昵称或别名"
                list="query-mappings"
                autocomplete="off"
                aria-label="营地 ID、游戏昵称或别名"
                required
            /></label>
            <datalist id="query-mappings"></datalist>
            <button id="btn-query-profile" class="button outline" type="button">
              查询资料
            </button>
            <button id="btn-query-battle" class="button primary" type="submit">
              查询战绩
            </button>
          </form>
          <div id="query-result" aria-live="polite">
            <div class="welcome-state">
              <span data-icon="search"></span>
              <h2>从一个玩家开始</h2>
              <p>输入营地 ID、游戏昵称或已保存的别名，查看真实对局表现。</p>
              <button class="button text" data-go-login type="button">
                管理登录账号 <span data-icon="arrow"></span>
              </button>
            </div>
          </div>
        </section>
        <section id="panel-login" class="page-panel">
          <header class="page-heading">
            <div>
              <h1>账号管理</h1>
              <p>选择微信或 QQ，扫码授权营地账号</p>
            </div>
            <button id="btn-refresh" class="button text" type="button">
              <span data-icon="refresh"></span>刷新
            </button>
          </header>
          <div class="login-layout">
            <section class="login-panel" aria-label="扫码登录">
              <div
                class="segmented login-platform"
                role="group"
                aria-label="登录方式"
              >
                <button
                  data-platform="wechat"
                  class="active"
                  aria-pressed="true"
                  type="button"
                >
                  微信</button
                ><button data-platform="qq" aria-pressed="false" type="button">
                  QQ
                </button>
              </div>
              <div class="qr-box" id="qr-box">
                <div class="qr-placeholder" id="qr-placeholder">
                  <span data-icon="qr"></span><span>获取二维码后扫码登录</span>
                </div>
                <img id="qr-image" alt="登录二维码" hidden />
              </div>
              <div class="qr-status" id="qr-status" role="status">等待开始</div>
              <div class="qr-countdown" id="qr-countdown"></div>
              <div class="login-actions">
                <button id="btn-qrcode" class="button primary" type="button">
                  获取二维码</button
                ><button
                  id="btn-cancel"
                  class="button outline"
                  type="button"
                  disabled
                >
                  取消
                </button>
              </div>
              <p class="login-note" id="login-note">
                请使用账号对应的微信扫码并在手机上确认。
              </p>
            </section>
            <section class="accounts-panel">
              <div class="section-heading">
                <h2>已登录账号</h2>
                <button
                  id="btn-check-accounts"
                  class="button outline small"
                  type="button"
                >
                  检测登录态
                </button>
              </div>
              <div id="account-list"></div>
              <div
                id="account-check-result"
                class="inline-notice"
                role="status"
                hidden
              ></div>
              <div class="account-footer">
                <button
                  id="btn-clear-accounts"
                  class="button text danger"
                  type="button"
                >
                  <span data-icon="trash"></span>清空账号
                </button>
              </div>
            </section>
          </div>
          <p class="page-note">
            登录账号用于数据查询，账号信息只保存在插件数据目录。
          </p>
        </section>
        <section id="panel-aliases" class="page-panel" hidden>
          <header class="page-heading">
            <div>
              <h1>角色别名</h1>
              <p>用更好记的名字找到玩家</p>
            </div>
          </header>
          <form id="alias-search-form" class="search-bar compact">
            <label class="search-field"
              ><span data-icon="search"></span
              ><input
                id="alias-search"
                type="search"
                placeholder="搜索游戏昵称、营地 ID 或别名"
                aria-label="搜索角色" /></label
            ><button class="button outline" type="submit">搜索</button>
          </form>
          <div id="alias-list"></div>
          <p class="page-note">
            游戏昵称与营地 ID
            在查询成功后自动记录。你可以设置独立别名，留空即可清除。
          </p>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
    <!-- 宿主 iframe 禁用浏览器确认框，因此使用可聚焦的页面内弹窗。 -->
    <div
      id="confirm-mask"
      class="modal-mask"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirm-title"
      hidden
    >
      <div class="modal">
        <h2 id="confirm-title">确认操作</h2>
        <p id="confirm-text"></p>
        <div class="modal-actions">
          <button class="button outline" id="confirm-no" type="button">
            取消</button
          ><button class="button primary" id="confirm-yes" type="button">
            确定
          </button>
        </div>
      </div>
    </div>
    <div
      id="alias-edit-mask"
      class="modal-mask"
      role="dialog"
      aria-modal="true"
      aria-labelledby="alias-edit-title"
      hidden
    >
      <form id="alias-edit-form" class="modal">
        <h2 id="alias-edit-title">设置角色别名</h2>
        <p id="alias-edit-meta"></p>
        <label class="field-label" for="alias-edit-name">别名</label
        ><input
          id="alias-edit-name"
          class="input"
          type="text"
          maxlength="80"
          placeholder="留空可清除别名"
        />
        <div class="modal-actions">
          <button class="button outline" id="alias-edit-cancel" type="button">
            取消</button
          ><button class="button primary" id="alias-edit-save" type="submit">
            保存别名
          </button>
        </div>
      </form>
    </div>
    <script defer src="./navigation.js"></script>
    <script defer id="page-app" src="./app.bundle.js"></script>
  </body>
</html>
